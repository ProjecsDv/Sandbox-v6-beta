<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox - DeX</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{height:100vh;background:#0e0e0e url('https://images.unsplash.com/photo-1557683316-973673baf926?w=1200') center/cover;font-family:Inter,Segoe UI,sans-serif;color:#fff;overflow:hidden}
  #topbar{height:32px;background:rgba(0,0,0,0.5);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px}
  #desktop{height:calc(100vh - 32px - 72px);position:relative;display:flex;align-items:center;justify-content:center}
  #launcher{width:680px;max-width:92vw;background:rgba(30,30,30,0.9);backdrop-filter:blur(20px);border-radius:20px;padding:24px;border:1px solid rgba(255,255,255,0.1)}
  #launcher h2{text-align:center;margin-bottom:20px;font-weight:400;letter-spacing:1px}
  .apps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .app-card{background:rgba(255,255,255,0.06);border-radius:16px;padding:20px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,0.08);transition:0.2s}
  .app-card:hover{background:rgba(255,255,255,0.12);transform:translateY(-2px)}
  .app-card .ico{width:56px;height:56px;background:#fff;color:#111;border-radius:14px;display:grid;place-items:center;margin:0 auto 12px;font-weight:700;font-size:22px}
  .app-card.sala .ico{background:#3a86ff;color:#fff}
  #taskbar{height:72px;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.85);backdrop-filter:blur(20px);border-radius:18px;padding:8px 18px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,0.1)}
  #taskbar .tb-icon{width:48px;height:48px;background:rgba(255,255,255,0.1);border-radius:12px;display:grid;place-items:center;cursor:pointer}
  .window{position:absolute;top:50px;left:50%;transform:translateX(-50%);width:720px;max-width:96vw;max-height:80vh;background:#1e1e1e;border-radius:16px;border:1px solid #333;box-shadow:0 20px 60px rgba(0,0,0,0.6);display:none;flex-direction:column;overflow:hidden}
  .window.open{display:flex}
  .win-head{height:44px;background:#2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
  .win-head .left{display:flex;align-items:center;gap:10px}
  .dot{width:12px;height:12px;border-radius:50%;background:#555;cursor:pointer}
  .win-body{padding:16px;overflow:auto;background:#1a1a1a}
  button{width:100%;padding:12px;margin:6px 0;background:#2d2d2d;border:1px solid #444;color:#fff;border-radius:10px;cursor:pointer}
  button.primary{background:#fff;color:#111;font-weight:600}
  button.danger{border-color:#a33;color:#f88}
  input{width:100%;padding:12px;background:#111;border:1px solid #444;color:#fff;border-radius:10px;text-align:center;font-size:22px;letter-spacing:8px}
  #progress{height:3px;background:#fff;width:0%}
  .log{margin-top:10px;background:#000;border-radius:8px;padding:8px;height:100px;overflow:auto;white-space:pre-wrap;font-family:monospace;font-size:12px}
  .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
  .file-card{background:#252525;border:1px solid #333;border-radius:10px;padding:10px;text-align:center;font-size:12px}
  .file-card button{padding:6px;font-size:11px;margin-top:6px}
  #screen{width:100%;background:#000;border-radius:10px;overflow:hidden;margin-top:10px}
  #screen canvas{width:100%}
</style>
</head>
<body>

<div id="topbar"><span>Sandbox</span><span id="clock"></span></div>

<div id="desktop">
  <div id="launcher">
    <h2>Escolha o modo</h2>
    <div class="apps">
      <div class="app-card" id="openHost"><div class="ico">H</div><b>Host</b><br><small>Enviar arquivos deste aparelho</small></div>
      <div class="app-card sala" id="openSala"><div class="ico">S</div><b>Sala</b><br><small>Receber com codigo</small></div>
    </div>
  </div>

  <div class="window" id="winHost">
    <div class="win-head"><div class="left"><div class="dot close"></div> Host</div><span id="roomCode" style="letter-spacing:6px;font-weight:bold">----</span></div>
    <div id="progress"></div>
    <div class="win-body">
      <button id="btnSave" class="primary">Adicionar arquivo</button>
      <div style="display:flex;gap:8px"><button id="btnList">Listar</button><button id="btnShare">Enviar</button></div>
      <button id="btnClear" class="danger">Limpar cofre</button>
      <div class="file-grid" id="fileList"></div>
      <div class="log" id="logHost"></div>
    </div>
  </div>

  <div class="window" id="winSala">
    <div class="win-head"><div class="left"><div class="dot close"></div> Sala</div></div>
    <div class="win-body">
      <input id="inputCode" placeholder="0000" maxlength="4">
      <button id="btnJoin" class="primary">Conectar</button>
      <button id="btnListRemote">Listar recebidos</button>
      <button id="btnClear2" class="danger">Limpar</button>
      <div class="file-grid" id="fileList2"></div>
      <div class="log" id="logSala"></div>
    </div>
  </div>

  <div class="window" id="winV86">
    <div class="win-head"><div class="left"><div class="dot close"></div> Virtual Machine - v86</div></div>
    <div class="win-body">
      <div id="screen"></div>
      <button id="btnStopV86" class="danger">Desligar</button>
    </div>
  </div>
</div>

<div id="taskbar">
  <div class="tb-icon" id="tbLauncher">⌂</div>
  <div class="tb-icon" id="tbHost">H</div>
  <div class="tb-icon" id="tbSala">S</div>
  <div class="tb-icon" id="tbVm">▶</div>
</div>

<script src="https://copy.sh/v86/build/libv86.js"></script>
<script>
const logHostEl = document.getElementById('logHost');
const logSalaEl = document.getElementById('logSala');
const progressEl = document.getElementById('progress');
function logH(t){ logHostEl.textContent += t + "\n"; }
function logS(t){ logSalaEl.textContent += t + "\n"; }
function logBoth(t){ logH(t); logS(t); document.getElementById('logHost').parentElement ? null : null; const el = document.getElementById('logHost').closest('.window').classList.contains('open') ? logHostEl : logSalaEl; }
function setProgress(p){ progressEl.style.width = p + "%"; }

setInterval(()=>{ document.getElementById('clock').textContent = new Date().toLocaleTimeString(); },1000);

let opfsCache = null;
async function getDir(){ if(opfsCache) return opfsCache; const r = await navigator.storage.getDirectory(); opfsCache = await r.getDirectoryHandle("sandbox",{create:true}); return opfsCache; }
async function fileHash(f){ const s = await f.slice(0,1024*1024).arrayBuffer(); const d = await crypto.subtle.digest("SHA-256",s); return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,8); }

function openWin(id){ document.querySelectorAll('.window').forEach(w=>w.classList.remove('open')); document.getElementById(id).classList.add('open'); }
function closeWins(){ document.querySelectorAll('.window').forEach(w=>w.classList.remove('open')); document.getElementById('launcher').style.display='block'; }

document.getElementById('openHost').onclick = () => { document.getElementById('launcher').style.display='none'; openWin('winHost'); if(!currentRoom) createHost(); };
document.getElementById('openSala').onclick = () => { document.getElementById('launcher').style.display='none'; openWin('winSala'); };
document.getElementById('tbLauncher').onclick = closeWins;
document.getElementById('tbHost').onclick = () => { document.getElementById('launcher').style.display='none'; openWin('winHost'); };
document.getElementById('tbSala').onclick = () => { document.getElementById('launcher').style.display='none'; openWin('winSala'); };
document.getElementById('tbVm').onclick = () => openWin('winV86');
document.querySelectorAll('.dot.close').forEach(d=> d.onclick = closeWins);

let currentRoom=null,peerConn=null,dataChannel=null,emulator=null;

function createHost(){
  currentRoom = Math.floor(1000+Math.random()*9000).toString();
  document.getElementById('roomCode').textContent = currentRoom;
  logH("Codigo da sala: " + currentRoom);
  const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  peerConn=pc; dataChannel=pc.createDataChannel("files");
  setupChannel(dataChannel,true);
  pc.onicecandidate=()=>localStorage.setItem("offer_"+currentRoom,JSON.stringify(pc.localDescription));
  pc.createOffer().then(o=>pc.setLocalDescription(o));
  const iv=setInterval(async()=>{ const a=localStorage.getItem("answer_"+currentRoom); if(a&&pc.signalingState!=="stable"){ await pc.setRemoteDescription(JSON.parse(a)); clearInterval(iv); logH("Sala conectada"); } },1000);
}

document.getElementById("btnSave").onclick = async()=>{
  try{
    const [fh]=await window.showOpenFilePicker(); const file=await fh.getFile();
    const dir=await getDir(); const hash=await fileHash(file); const name=hash+"_"+file.name;
    try{ await dir.getFileHandle(name); logH("Ja existe: "+name); return; }catch{}
    const est=await navigator.storage.estimate(); if(file.size>(est.quota-est.usage)){ logH("Sem espaco"); return; }
    await navigator.storage.persist();
    const dest=await dir.getFileHandle(name,{create:true}); const w=await dest.createWritable();
    const chunk=4*1024*1024; let off=0;
    while(off<file.size){ await w.write({type:"write",position:off,data:file.slice(off,off+chunk)}); off+=chunk; setProgress((off/file.size)*100); if(off%(20*1024*1024)===0) await new Promise(r=>setTimeout(r,0)); }
    await w.close(); setProgress(0); logH("Salvo: "+name); renderFileList();
  }catch(e){ if(e.name!=="AbortError") logH("Erro: "+e.message); }
};

async function renderFileList(){
  const dir=await getDir();
  document.getElementById('fileList').innerHTML=""; document.getElementById('fileList2').innerHTML="";
  for await(const [name,handle] of dir.entries()){
    const f=await handle.getFile();
    const card=document.createElement('div'); card.className='file-card';
    card.innerHTML=`<div>${name.slice(0,20)}</div><small>${(f.size/1024/1024).toFixed(1)} MB</small><br><button data-run="${name}">Rodar</button><button data-del="${name}">Del</button>`;
    document.getElementById('fileList').appendChild(card.cloneNode(true));
    document.getElementById('fileList2').appendChild(card);
  }
  document.querySelectorAll('[data-run]').forEach(b=> b.onclick=()=> bootV86(b.dataset.run));
  document.querySelectorAll('[data-del]').forEach(b=> b.onclick= async()=>{ const d=await getDir(); await d.removeEntry(b.dataset.del); logH("Removido"); renderFileList(); });
}

document.getElementById("btnList").onclick = async()=>{ logHostEl.textContent=""; const dir=await getDir(); for await(const [n,h] of dir.entries()){ const f=await h.getFile(); logH(n+" - "+(f.size/1024/1024).toFixed(1)+" MB"); } await renderFileList(); };
document.getElementById("btnListRemote").onclick = document.getElementById("btnList").onclick;
document.getElementById("btnClear").onclick = async()=>{ if(!confirm("Apagar?")) return; const d=await getDir(); const t=[]; for await(const n of d.keys()) t.push(d.removeEntry(n)); await Promise.all(t); logH("Limpo"); renderFileList(); };
document.getElementById("btnClear2").onclick = document.getElementById("btnClear").onclick;

async function bootV86(name){
  document.getElementById('launcher').style.display='none'; openWin('winV86');
  document.getElementById('screen').innerHTML="";
  const dir=await getDir(); const file=await (await dir.getFileHandle(name)).getFile(); const buf=await file.arrayBuffer();
  logH("Iniciando v86: "+name);
  if(emulator) try{ emulator.stop(); }catch{}
  emulator=new V86Starter({
    screen_container: document.getElementById("screen"),
    bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
    vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
    cdrom: { buffer: buf },
    autostart: true, memory_size: 128*1024*1024
  });
}
document.getElementById("btnStopV86").onclick=()=>{ if(emulator) emulator.stop(); closeWins(); };

function setupChannel(ch,isHost){
  ch.binaryType="arraybuffer";
  ch.onopen=()=> (isHost?logH:logS)(isHost?"Sala conectada":"Conectado");
  ch.onmessage= async e=>{
    if(typeof e.data==="string"&&e.data.startsWith("META:")){
      const m=JSON.parse(e.data.slice(5)); ch._meta=m; ch._buf=[]; ch._rec=0; (isHost?logH:logS)("Recebendo: "+m.name);
    } else {
      ch._buf.push(e.data); ch._rec+=e.data.byteLength; setProgress((ch._rec/ch._meta.size)*100);
      if(ch._rec>=ch._meta.size){ const blob=new Blob(ch._buf); const dir=await getDir(); const dest=await dir.getFileHandle(ch._meta.name,{create:true}); const w=await dest.createWritable(); await w.write(blob); await w.close(); (isHost?logH:logS)("Salvo: "+ch._meta.name); setProgress(0); renderFileList(); }
    }
  };
}
function initHostConnection(c){ /* ja em createHost */ }

document.getElementById("btnJoin").onclick= async()=>{
  const code=document.getElementById("inputCode").value.trim();
  const offer=localStorage.getItem("offer_"+code); if(!offer){ logS("Sala nao encontrada"); return; }
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); peerConn=pc;
  pc.ondatachannel=e=>{ dataChannel=e.channel; setupChannel(dataChannel,false); };
  pc.onicecandidate=()=>localStorage.setItem("answer_"+code,JSON.stringify(pc.localDescription));
  await pc.setRemoteDescription(JSON.parse(offer)); const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); logS("Conectando...");
};
document.getElementById("btnShare").onclick= async()=>{
  if(!dataChannel||dataChannel.readyState!=="open"){ logH("Ninguem conectado"); return; }
  const dir=await getDir();
  for await(const [name,handle] of dir.entries()){
    const file=await handle.getFile(); dataChannel.send("META:"+JSON.stringify({name,size:file.size}));
    let off=0; const chunk=64*1024; while(off<file.size){ dataChannel.send(await file.slice(off,off+chunk).arrayBuffer()); off+=chunk; setProgress((off/file.size)*100); await new Promise(r=>setTimeout(r,0)); }
    logH("Enviado: "+name);
  } setProgress(0);
};
</script>
</body>
</html>
